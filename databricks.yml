# This is a Declarative Automation Bundle definition for vancouver_transit.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: vancouver_transit
  uuid: 4b33e1c0-1e63-4913-ba86-095515fb2532

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema_prefix:
    description: Domain prefix for the medallion schemas, per {domain}_{layer}

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-817e0bdc-6c87.cloud.databricks.com
    variables:
      catalog: gtfs_dev
      schema_prefix: transit
  prod:
    mode: production
    workspace:
      host: https://dbc-817e0bdc-6c87.cloud.databricks.com
      # Deploy under the deploying principal's home so there is only a single copy.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: gtfs_prod
      schema_prefix: transit
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
