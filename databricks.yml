# This is a Declarative Automation Bundle definition for vancouver_transit.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: vancouver_transit
  uuid: 4b33e1c0-1e63-4913-ba86-095515fb2532

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://8259563809696779.9.gcp.databricks.com
    variables:
      catalog: transit
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://8259563809696779.9.gcp.databricks.com
      # We explicitly deploy to /Workspace/Users/wangyitian91@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/wangyitian91@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: transit
      schema: prod
    permissions:
      - user_name: wangyitian91@gmail.com
        level: CAN_MANAGE
