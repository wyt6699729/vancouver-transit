# Bronze ingestion of the TransLink GTFS Static feed via Auto Loader.
# Source files are landed in a UC volume by the gtfs_ingest job's download task.

resources:
  pipelines:
    gtfs_bronze_ingest:
      name: gtfs_bronze_ingest
      catalog: ${var.catalog}
      schema: ${var.gtfs_bronze_schema}
      serverless: true
      continuous: false
      root_path: "../src/gtfs_bronze"

      libraries:
        - glob:
            include: ../src/gtfs_bronze/transformations/**
