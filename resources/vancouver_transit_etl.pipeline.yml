# The main pipeline for vancouver_transit

resources:
  pipelines:
    vancouver_transit_etl:
      name: vancouver_transit_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/vancouver_transit_etl"

      libraries:
        - glob:
            include: ../src/vancouver_transit_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
